; PlatformIO Configuration for VS Code
; Compatible with both VS Code (PlatformIO) and Arduino IDE

[platformio]
src_dir = env_station
include_dir = env_station
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit AHTX0
  adafruit/Adafruit BMP280 Library
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library

; 1. Current board: ESP32 DevKit 30P
[env:esp32dev]
board = esp32dev

; 2. Mini board: ESP32-C3 Super Mini
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
